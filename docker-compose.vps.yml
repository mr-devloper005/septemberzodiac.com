services:
  rsu3g43mc3:
    container_name: rsu3g43mc3_app
    image: ghcr.io/mr-devloper005/septemberzodiac.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3065:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
